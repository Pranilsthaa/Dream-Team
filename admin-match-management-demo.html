<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Forge Match Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#14291E;--deep:#0C2517;--panel:#2B4A35;--field:#F1F2DF;--edge:#08180E;
  --pitch:#39784B;--pitch2:#355941;--lime:#C4F27D;--lime-mu:#A3D76D;--lime-sh:#537A3B;--warn:#FFD87D;
  --text:#F6F4E8;--muted:#B4C9B6;--ink:#14291E;--guest:#314E38;--guest-bd:#80A47B;--foot:#749277;--focus:#A4D96A;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;--sport:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:var(--body);color:var(--text)}
button,select{font-family:inherit;color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;background:var(--deep);border-right:2px solid var(--edge)}
.brand{display:flex;align-items:center;gap:10px;font:italic 800 26px/1 var(--sport)}
.mk{width:26px;height:26px;background:var(--lime);box-shadow:0 3px 0 var(--lime-sh);clip-path:polygon(0 20%,20% 20%,20% 0,80% 0,80% 20%,100% 20%,100% 80%,80% 80%,80% 100%,20% 100%,20% 80%,0 80%)}
.side>small{color:var(--muted);margin:2px 0 18px;font:500 13px/1 var(--body)}
.nv{display:flex;flex-direction:column;gap:6px}
.nb{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:12px;background:none;color:var(--muted);font:600 15px/1 var(--body);cursor:pointer;text-align:left}
.nb[aria-selected=true]{background:var(--panel);color:var(--lime)}
.main{min-width:0;padding:22px clamp(14px,3vw,36px) 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font:italic 800 clamp(30px,4.5vw,42px)/1 var(--sport)}
h2{margin:0 0 12px;font:italic 800 22px/1 var(--sport)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--deep);border:2px solid var(--edge);font:600 14px/1 var(--body)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.live{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
@media (max-width:1000px){.live,.two{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--deep);border-radius:14px;padding:12px;text-align:center}.tile b{display:block;font:italic 800 32px/1 var(--sport);color:var(--lime)}.tile span{font:500 13px/1.2 var(--body);color:var(--muted)}
.chs,.fil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:999px;background:var(--deep);border:2px solid var(--edge);font:600 14px/1 var(--body);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--lime);color:var(--ink);box-shadow:0 3px 0 var(--lime-sh)}
.chip:disabled{opacity:.35;cursor:not-allowed}
label{display:block;margin:0 0 8px;color:var(--muted);font:600 13px/1 var(--body)}
select{width:100%;height:48px;padding:0 12px;border-radius:12px;background:var(--field);color:var(--ink);border:2px solid var(--edge);border-bottom-width:4px;font:600 16px/1 var(--body);margin-bottom:14px}
.btn{display:block;width:100%;min-height:50px;padding:0 16px;border-radius:14px;cursor:pointer;border:2px solid var(--guest-bd);background:var(--guest);color:var(--text);font:italic 800 20px/1 var(--sport);letter-spacing:.4px;box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn.go{background:var(--lime);color:var(--ink);border:0;box-shadow:0 5px 0 var(--lime-sh)}
.btn.bad{background:var(--warn);color:var(--ink);border:0;box-shadow:0 5px 0 #a8873c}
.btn.sm{min-height:42px;font-size:17px;display:inline-block;width:auto}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.nb:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 14px/1.2 var(--body);text-align:center}
.tb{width:46px;height:46px;border-radius:12px;background:var(--c);display:grid;place-items:center;font:italic 800 20px/1 var(--sport);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.mid{text-align:center;color:var(--muted);font:600 13px/1.3 var(--body)}.mid b{display:block;font:italic 800 24px/1 var(--sport);color:var(--text)}
.bd{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--deep);color:var(--muted);font:600 11px/1 var(--body)}.bd.l{background:var(--lime);color:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font:500 13px/1.2 var(--body);margin-bottom:12px}
.xi{display:flex;flex-wrap:wrap;gap:8px}
.cnt{float:right;color:var(--lime);font:600 13px/1 var(--body)}
.score{background:repeating-linear-gradient(90deg,var(--pitch) 0 34px,var(--pitch2) 34px 68px);border-radius:18px;border:2px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:16px}
.score .tn{font:600 14px/1 var(--body);background:rgba(8,24,14,.8);display:inline-block;padding:6px 10px;border-radius:999px}
.score .big{font:italic 800 clamp(52px,9vw,72px)/1 var(--sport);margin:10px 0 4px}.score .big small{font-size:.4em;font-weight:800;color:var(--lime)}
.score .sub{display:flex;gap:14px;flex-wrap:wrap;font:600 14px/1.3 var(--body)}.score .sub b{color:var(--lime)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:500 14px/1.2 var(--body)}
th{color:var(--muted);font:600 12px/1 var(--body);text-align:right;padding:6px}td{padding:10px 6px;border-top:2px solid var(--edge);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}td.nm{white-space:normal}td small{display:block;color:var(--muted);font-size:12px}
td.hi,td b{color:var(--lime);font-weight:600}
.balls{display:flex;gap:8px;flex-wrap:wrap;min-height:38px}
.bl{min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;background:var(--deep);font:600 13px/1 var(--body)}
.bl.f4{background:var(--lime-mu);color:var(--ink)}.bl.f6{background:var(--lime);color:var(--ink)}.bl.w{background:var(--warn);color:var(--ink)}.bl.x{border:2px dashed var(--lime)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pad .btn{padding:0;min-height:58px;font-size:26px}
@media (max-width:560px){.pad{grid-template-columns:repeat(3,1fr)}}
.ex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.ex .chip{text-align:center;padding:13px 0;font-size:15px}
.hint{color:var(--muted);font:500 13px/1.4 var(--body);margin:0 0 12px;min-height:18px}
.log{max-height:520px;overflow-y:auto;display:grid;gap:8px}
.lg{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--deep);font:500 14px/1.3 var(--body)}.lg b{color:var(--lime);min-width:34px;font-weight:600}.lg.w{border-left:4px solid var(--warn)}
.empty{text-align:center;padding:40px 16px}.empty p{color:var(--muted);margin:8px 0 18px}
.step{display:inline-flex;gap:6px;align-items:center}.step button{width:32px;height:32px;border-radius:8px;border:2px solid var(--edge);background:var(--deep);cursor:pointer;font:700 18px/1 var(--body)}
.rl{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.rl span{display:flex;gap:8px;align-items:center;font:600 14px/1 var(--body)}.rl b{min-width:26px;text-align:center;color:var(--lime);font:italic 800 22px/1 var(--sport)}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}.ov.on{display:flex}
.sheet{width:min(520px,100%);max-height:88dvh;overflow-y:auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));background:var(--bg);border:2px solid var(--edge);border-radius:22px 22px 0 0;animation:up .25s ease-out}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 4px;font:italic 800 28px/1 var(--sport)}.sheet p{margin:0 0 14px;color:var(--muted);font:500 14px/1.4 var(--body)}
.sheet .two{margin:16px 0 0;gap:10px;grid-template-columns:1fr 1fr}
.toast{position:fixed;left:50%;bottom:90px;z-index:40;transform:translate(-50%,10px);max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--deep);border:2px solid var(--lime);color:var(--lime);font:600 14px/1.25 var(--body);opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:2px solid var(--edge)}
  .brand,.side>small{display:none}.nv{flex-direction:row;flex:1}
  .nb{flex:1;flex-direction:column;gap:4px;padding:8px 2px;font-size:11px;text-align:center}
  .main{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){.dot,.sheet{animation:none}.btn,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><i class="mk"></i>Fantasy Forge</div><small>Match manager</small><nav class="nv" id="nav" role="tablist"></nav></aside>
  <div class="main">
    <div class="bar"><h1 id="ttl">Match centre</h1><div id="barx"></div></div>
    <section class="view on" id="v-matches"></section>
    <section class="view" id="v-setup"></section>
    <section class="view" id="v-live"></section>
    <section class="view" id="v-card"></section>
    <section class="view" id="v-pts"></section>
  </div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var SN=['Rao','Lee','Nair','Sen','Das','Roy','Iyer','Bose','Pal','Ghosh','Mehta','Khan','Joshi','Silva','Thapa','Novak','Ali','Rai','Dey','Paul','Singh','Shah','Kapoor','Gill','Bhat','Menon','Nayak','Verma','Jain','Reddy'];
var TM=['Hawks','Titans','Vipers','Wolves'],COL={Hawks:'#2f6bff',Titans:'#ff7a1a',Vipers:'#a02cff',Wolves:'#e8312f'};
function squad(t){var k=TM.indexOf(t),o=[];for(var i=0;i<13;i++)o.push(String.fromCharCode(65+(k*7+i*3)%26)+'. '+SN[(k*13+i)%30]);return o}
var MS=[{a:'Hawks',b:'Titans',st:'live',w:'Today',v:'Eden Ground'},{a:'Vipers',b:'Wolves',st:'up',w:'Today, 8:30 PM',v:'Green Park'},{a:'Titans',b:'Vipers',st:'up',w:'Tomorrow, 6:00 PM',v:'Eden Ground'},{a:'Wolves',b:'Hawks',st:'ft',w:'Yesterday',v:'City Oval',r:'Wolves won by 14 runs'},{a:'Hawks',b:'Vipers',st:'ft',w:'2 days ago',v:'Green Park',r:'Hawks won by 6 wickets'}];
var S=null,HIST=[],V='matches',MF='All',PX=null,WK={},LK=0,SC=0,RL={r:1,w:20,c:8};
var SU={a:'Vipers',b:'Wolves',ov:20,toss:'',dec:'',xa:squad('Vipers').slice(0,11),xb:squad('Wolves').slice(0,11)};

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}
function sheet(h,lock){LK=lock?1:0;$('sheet').innerHTML=h;$('ov').classList.add('on')}
function close(){$('ov').classList.remove('on');LK=0}
$('ov').addEventListener('click',function(e){if(e.target===this&&!LK)close()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!LK)close()});
function ovS(b){return Math.floor(b/6)+'.'+b%6}
function chips(arr,sel,key){return '<div class="chs">'+arr.map(function(n){return '<button class="chip" aria-pressed="'+(n===sel)+'" data-k="'+key+'" data-v="'+n+'">'+n+'</button>'}).join('')+'</div>'}

/* ---------- match engine ---------- */
function mk(bt,bw){return{bat:bt,bowl:bw,runs:0,w:0,b:0,ext:0,fow:[],order:[],bd:[],bs:{},ws:{},ov:[],log:[],st:'',ns:'',bw:'',lb:'',end:0}}
function openInn(k){var I=S.inn[k],xi=S.X[I.bat];I.order=xi.slice();xi.forEach(function(n){I.bs[n]={r:0,b:0,f:0,s:0,o:''}});S.X[I.bowl].forEach(function(n){I.ws[n]={b:0,r:0,w:0}});I.st=xi[0];I.ns=xi[1];I.bd=[xi[0],xi[1]];S.i=k}
function start(a,b,ov,first,xa,xb){var X={};X[a]=xa;X[b]=xb;var sec=first===a?b:a;S={ov:ov,a:a,b:b,X:X,i:0,inn:[mk(first,sec),mk(sec,first)],ct:{},brk:0,done:0,res:''};HIST=[];openInn(0)}
function fin(){var a=S.inn[0],b=S.inn[1];S.done=1;S.res=b.runs>a.runs?b.bat+' won by '+(10-b.w)+' wickets':b.runs===a.runs?'Match tied':a.bat+' won by '+(a.runs-b.runs)+' runs'}
function applyBall(e){
 var I=S.inn[S.i],sn=I.st,bs=I.bs[sn],bo=I.ws[I.bw],x=e.x,r=e.r,tr=r,leg=1,tag=String(r);
 if(x==='wd'){tr=r+1;leg=0;I.ext+=tr;bo.r+=tr;tag='Wd'+(r?'+'+r:'')}
 else if(x==='nb'){tr=r+1;leg=0;I.ext+=1;bo.r+=tr;bs.r+=r;bs.b++;if(r===4)bs.f++;if(r===6)bs.s++;tag='Nb'+(r?'+'+r:'')}
 else if(x==='b'||x==='lb'){I.ext+=r;bs.b++;tag=(x==='b'?'B':'LB')+r}
 else{bs.r+=r;bs.b++;bo.r+=r;if(r===4)bs.f++;if(r===6)bs.s++}
 I.runs+=tr;if(leg){I.b++;bo.b++}
 var txt=tag==='4'?'FOUR':tag==='6'?'SIX':tag==='0'?'no run':tag,cls=tag==='4'?'f4':tag==='6'?'f6':x?'x':'',lbl=tag;
 if(e.w){var w=e.w,out=w.out||sn,ob=I.bs[out];I.w++;
  ob.o=w.k==='Bowled'?'b '+I.bw:w.k==='Caught'?'c '+w.fl+' b '+I.bw:w.k==='LBW'?'lbw b '+I.bw:w.k==='Stumped'?'st '+w.fl+' b '+I.bw:'run out ('+(w.fl||'direct')+')';
  if(w.k!=='Run out')bo.w++;if(w.k==='Caught')S.ct[w.fl]=(S.ct[w.fl]||0)+1;
  I.fow.push(I.runs+'-'+I.w+' ('+out+', '+ovS(I.b)+')');
  if(w.nx){I.bd.push(w.nx);if(out===I.st)I.st=w.nx;else I.ns=w.nx}
  txt='OUT, '+ob.o;cls='w';lbl='W'}
 I.ov.push({t:lbl,c:cls});I.log.push({o:ovS(I.b),t:I.bw+' to '+sn+', '+txt,w:!!e.w});
 if(!e.w&&r%2===1){var t=I.st;I.st=I.ns;I.ns=t}
 if(leg&&I.b%6===0){var t2=I.st;I.st=I.ns;I.ns=t2;I.lb=I.bw;I.bw='';I.pv=I.ov;I.ov=[]}
 if(I.w>=10||I.b>=S.ov*6||(S.i===1&&I.runs>S.inn[0].runs)){I.end=1;if(S.i===0)S.brk=1;else fin()}
}
function ball(e){HIST.push(JSON.stringify(S));PX=null;applyBall(e);post()}
function undo(){if(!HIST.length){toast('Nothing to undo');return}S=JSON.parse(HIST.pop());post()}
function post(){renderAll();if(!S)return;var I=S.inn[S.i];
 if(S.done)sheet('<h3>Match complete</h3><p>'+S.res+'</p><div class="two"><button class="btn" data-go="card">Scorecard</button><button class="btn go" data-go="pts">Fantasy points</button></div>');
 else if(S.brk){var a=S.inn[0];sheet('<h3>Innings break</h3><p>'+a.bat+' '+a.runs+'/'+a.w+' ('+ovS(a.b)+'). '+a.bowl+' need '+(a.runs+1)+' to win.</p><button class="btn go" data-a="inn2">Start 2nd innings</button>',1)}
 else if(!I.bw)bsheet()}
function bsheet(){var I=S.inn[S.i],mx=S.ov*6/5;sheet('<h3>Choose bowler</h3><p>'+(I.lb?'Over '+Math.floor(I.b/6+1)+'. Same bowler cannot bowl twice in a row.':'Opening over.')+'</p><div class="chs">'+S.X[I.bowl].map(function(n){var s=I.ws[n],off=n===I.lb||s.b>=mx;return '<button class="chip" data-bw="'+n+'"'+(off?' disabled':'')+'>'+n+' · '+ovS(s.b)+'-'+s.r+'-'+s.w+'</button>'}).join('')+'</div>',1)}
function seed(){var xa=squad('Hawks').slice(0,11),xb=squad('Titans').slice(0,11);start('Hawks','Titans',20,'Hawks',xa,xb);var I=S.inn[0],bi=10;I.bw=xb[bi];
 [1,4,0,1,'wd',2,0,6,1,0,'W',1,4,0,1,2,0,1,1,6,'nb',0,4,1,0,2,1,1,'W',0,1,4,2,1,0,1,1,0,6,1].forEach(function(t){
  if(!I.bw){I.lb=I.lb||'';bi=(bi+9)%11;if(xb[bi]===I.lb)bi=(bi+9)%11;I.bw=xb[bi]}
  if(t==='W')applyBall({r:0,w:{k:'Caught',fl:xb[3],out:I.st,nx:I.order.filter(function(n){return I.bd.indexOf(n)<0})[0]}});
  else if(t==='wd')applyBall({r:0,x:'wd'});else if(t==='nb')applyBall({r:0,x:'nb'});else applyBall({r:t})});
 if(!I.bw)I.bw=xb[(bi+9)%11]}

/* ---------- views ---------- */
function bar(){$('barx').innerHTML=S&&!S.done?'<span class="pill"><i class="dot"></i>'+S.a+' v '+S.b+' live</span>':''}
function mtch(){var c={live:0,up:0,ft:0};MS.forEach(function(m){c[m.st]++});
 $('v-matches').innerHTML='<div class="tiles"><div class="tile"><b>'+c.live+'</b><span>Live</span></div><div class="tile"><b>'+c.up+'</b><span>Upcoming</span></div><div class="tile"><b>'+c.ft+'</b><span>Completed</span></div></div>'+
 '<div class="fil" role="group" aria-label="Filter">'+['All','Live','Upcoming','Completed'].map(function(f){return '<button class="chip" aria-pressed="'+(f===MF)+'" data-f="'+f+'">'+f+'</button>'}).join('')+'<button class="btn go sm" style="margin-left:auto" data-go="setup">+ New match</button></div><div class="grid">'+
 MS.map(function(m,i){return[m,i]}).filter(function(p){var s=p[0].st;return MF==='All'||(MF==='Live'&&s==='live')||(MF==='Upcoming'&&s==='up')||(MF==='Completed'&&s==='ft')}).map(function(p){var m=p[0],i=p[1],live=m.st==='live',mid=live&&S?'<b>'+S.inn[S.i].runs+'/'+S.inn[S.i].w+'</b><span class="bd l">LIVE</span>':m.st==='ft'?'<b>FT</b><span class="bd">'+m.r+'</span>':'<b>v</b><span class="bd">'+m.w+'</span>';
  return '<div class="card"><div class="meta"><span>'+m.v+'</span><span>20 overs</span></div><div class="mt"><div class="tm"><div class="tb" style="--c:'+COL[m.a]+'">'+m.a[0]+'</div>'+m.a+'</div><div class="mid">'+mid+'</div><div class="tm"><div class="tb" style="--c:'+COL[m.b]+'">'+m.b[0]+'</div>'+m.b+'</div></div>'+
  '<div class="row">'+(live?'<button class="btn go" data-go="live">Score live</button><button class="btn" data-go="card">Scorecard</button>':m.st==='up'?'<button class="btn go" data-a="setm" data-i="'+i+'">Set up match</button>':'<button class="btn" data-a="arch">View scorecard</button>')+'</div></div>'}).join('')+'</div>'}

function setup(){var q=SU,n=function(l,s){return '<div class="card"><h2>'+l+' XI <span class="cnt">'+s.length+'/11</span></h2><div class="xi">'+squad(l).map(function(p){return '<button class="chip" aria-pressed="'+(s.indexOf(p)>-1)+'" data-x="'+(l===q.a?'a':'b')+'" data-n="'+p+'">'+p+'</button>'}).join('')+'</div></div>'};
 var opt=function(v){return TM.map(function(t){return '<option'+(t===v?' selected':'')+'>'+t+'</option>'}).join('')};
 $('v-setup').innerHTML='<div class="two"><div class="card"><h2>Match details</h2><label for="sa">Team A</label><select id="sa">'+opt(q.a)+'</select><label for="sb">Team B</label><select id="sb">'+opt(q.b)+'</select><label>Overs per side</label>'+chips(['5','10','20'],String(q.ov),'ov')+'</div>'+
 '<div class="card"><h2>Toss</h2><label>Won by</label>'+chips([q.a,q.b],q.toss,'toss')+'<label>Elected to</label>'+chips(['Bat','Bowl'],q.dec,'dec')+'<p class="hint">Pick exactly 11 players for each side, then start the match.</p></div></div>'+
 '<div class="two">'+n(q.a,q.xa)+n(q.b,q.xb)+'</div><button class="btn go" data-a="start">Start match</button>'}

function live(){var el=$('v-live');
 if(!S){el.innerHTML='<div class="card empty"><h2>No match in progress</h2><p>Set up a match to start ball-by-ball scoring.</p><button class="btn go sm" data-go="setup">Set up a match</button></div>';return}
 var I=S.inn[S.i],bs=I.bs[I.st],ns=I.bs[I.ns],bo=I.bw?I.ws[I.bw]:{b:0,r:0,w:0},crr=I.b?(I.runs*6/I.b).toFixed(2):'0.00',tg='',dis=(!I.bw||I.end||S.done)?' disabled':'';
 if(S.i===1){var t=S.inn[0].runs+1,nd=t-I.runs,bl=S.ov*6-I.b;tg='<span>Target <b>'+t+'</b></span><span>Need <b>'+Math.max(nd,0)+'</b> off <b>'+bl+'</b></span><span>RRR <b>'+(bl?(Math.max(nd,0)*6/bl).toFixed(2):'0.00')+'</b></span>'}
 var br=function(n,b,s){return '<tr><td class="nm">'+n+(s?' *':'')+'</td><td class="hi">'+b.r+'</td><td>'+b.b+'</td><td>'+b.f+'</td><td>'+b.s+'</td><td>'+(b.b?(b.r*100/b.b).toFixed(0):'0')+'</td></tr>'};
 el.innerHTML='<div class="live"><div class="stack"><div class="score"><span class="tn">'+I.bat+' batting · Innings '+(S.i+1)+'</span><div class="big">'+I.runs+'/'+I.w+' <small>('+ovS(I.b)+' / '+S.ov+')</small></div><div class="sub"><span>CRR <b>'+crr+'</b></span><span>Extras <b>'+I.ext+'</b></span>'+tg+'</div></div>'+
 '<div class="card tw"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+br(I.st,bs,1)+br(I.ns,ns,0)+'<tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th><th></th></tr><tr><td class="nm">'+(I.bw||'Not selected')+'</td><td>'+ovS(bo.b)+'</td><td>'+bo.r+'</td><td class="hi">'+bo.w+'</td><td>'+(bo.b?(bo.r*6/bo.b).toFixed(1):'0.0')+'</td><td></td></tr></table></div>'+
 '<div class="card"><h2>This over</h2><div class="balls">'+(I.ov.length?I.ov.map(function(b){return '<span class="bl '+b.c+'">'+b.t+'</span>'}).join(''):'<span class="hint">Over not started</span>')+'</div></div>'+
 '<div class="card"><h2>Score ball</h2><p class="hint">'+(PX?{wd:'Wide',nb:'No ball',b:'Bye',lb:'Leg bye'}[PX]+' selected. Tap the runs scored off it (0 for none).':'Tap the runs scored, or choose an extra first.')+'</p><div class="pad">'+[0,1,2,3,4,6].map(function(r){return '<button class="btn'+(r>=4?' go':'')+'" data-r="'+r+'"'+dis+'>'+r+'</button>'}).join('')+'</div>'+
 '<div class="ex">'+[['wd','Wd'],['nb','Nb'],['b','Bye'],['lb','LB']].map(function(x){return '<button class="chip" aria-pressed="'+(PX===x[0])+'" data-ex="'+x[0]+'"'+dis+'>'+x[1]+'</button>'}).join('')+'</div>'+
 '<div class="row"><button class="btn bad" data-a="wk"'+dis+'>Wicket</button><button class="btn" data-a="undo">Undo</button><button class="btn" data-a="swap"'+dis+'>Swap strike</button></div></div></div>'+
 '<div class="card"><h2>Commentary</h2><div class="log">'+I.log.slice(-25).reverse().map(function(l){return '<div class="lg'+(l.w?' w':'')+'"><b>'+l.o+'</b><span>'+l.t+'</span></div>'}).join('')+'</div></div></div>'}

function card(){var el=$('v-card');if(!S){el.innerHTML='<div class="card empty"><h2>No scorecard yet</h2><p>Start a match to see the scorecard.</p></div>';return}
 var k=Math.min(SC,S.inn[1].bd.length?1:0),I=S.inn[k],opt=[S.inn[0].bat+' innings'].concat(S.inn[1].bd.length?[S.inn[1].bat+' innings']:[]);
 var bt=I.order.filter(function(n){return I.bd.indexOf(n)>-1}).map(function(n){var b=I.bs[n],at=!b.o&&(n===I.st||n===I.ns)&&!I.end;return '<tr><td class="nm">'+n+'<small>'+(b.o||(at?'not out':'not out'))+'</small></td><td class="hi">'+b.r+'</td><td>'+b.b+'</td><td>'+b.f+'</td><td>'+b.s+'</td><td>'+(b.b?(b.r*100/b.b).toFixed(0):'0')+'</td></tr>'}).join('');
 var dnb=I.order.filter(function(n){return I.bd.indexOf(n)<0});
 var bw=I.order.length?S.X[I.bowl].filter(function(n){return I.ws[n].b>0}).map(function(n){var s=I.ws[n];return '<tr><td class="nm">'+n+'</td><td>'+ovS(s.b)+'</td><td>'+s.r+'</td><td class="hi">'+s.w+'</td><td>'+(s.b?(s.r*6/s.b).toFixed(1):'0.0')+'</td></tr>'}).join(''):'';
 el.innerHTML=chips(opt,opt[k],'sc')+'<div class="two"><div class="card tw"><h2>Batting · '+I.bat+'</h2><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>'+bt+'<tr><td class="nm">Extras</td><td>'+I.ext+'</td><td colspan="4"></td></tr><tr><td class="nm"><b>Total</b></td><td class="hi">'+I.runs+'/'+I.w+'</td><td colspan="4">('+ovS(I.b)+' ov)</td></tr></table>'+(dnb.length?'<p class="hint" style="margin-top:12px">Yet to bat: '+dnb.join(', ')+'</p>':'')+'</div>'+
 '<div class="stack"><div class="card tw"><h2>Bowling · '+I.bowl+'</h2><table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th></tr>'+bw+'</table></div><div class="card"><h2>Fall of wickets</h2><p class="hint">'+(I.fow.length?I.fow.join(' · '):'No wickets yet')+'</p></div></div></div>'}

function pts(){var el=$('v-pts');if(!S){el.innerHTML='<div class="card empty"><h2>No points yet</h2><p>Points are calculated from the stats recorded during a match.</p></div>';return}
 var rows=[];S.inn.forEach(function(I){});TM.forEach(function(t){if(S.X[t])S.X[t].forEach(function(n){var r=0,w=0;S.inn.forEach(function(I){if(I.bs[n])r+=I.bs[n].r;if(I.ws[n])w+=I.ws[n].w});var c=S.ct[n]||0,p=r*RL.r+w*RL.w+c*RL.c;rows.push([n,t,r,w,c,p])})});
 rows=rows.filter(function(x){return x[2]||x[3]||x[4]}).sort(function(a,b){return b[5]-a[5]});
 var st=function(k,l){return '<span>'+l+' <span class="step"><button data-rs="'+k+'" data-d="-1" aria-label="Decrease '+l+'">−</button><b>'+RL[k]+'</b><button data-rs="'+k+'" data-d="1" aria-label="Increase '+l+'">+</button></span></span>'};
 el.innerHTML='<div class="card" style="margin-bottom:16px"><h2>Scoring rules</h2><div class="rl">'+st('r','Run')+st('w','Wicket')+st('c','Catch')+'</div><p class="hint">Points are calculated from recorded match stats. Changing a rule updates the table instantly.</p></div>'+
 '<div class="card tw"><h2>Player points</h2><table><tr><th>Player</th><th>Runs</th><th>Wkts</th><th>Catches</th><th>Pts</th></tr>'+rows.map(function(x){return '<tr><td class="nm">'+x[0]+'<small>'+x[1]+'</small></td><td>'+x[2]+'</td><td>'+x[3]+'</td><td>'+x[4]+'</td><td class="hi"><b>'+x[5]+'</b></td></tr>'}).join('')+'</table></div>'+
 '<div style="margin-top:16px" class="row"><button class="btn go" data-a="pub"'+(S.done?'':' disabled')+'>Publish points to leagues</button></div><p class="hint" style="margin-top:10px">'+(S.done?'Match complete. Publishing locks the stats.':'Available when the match is complete. Points update live until then.')+'</p>'}

var IC={matches:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',setup:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',live:'<circle cx="12" cy="12" r="3"/><path d="M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',card:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/>',pts:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/>'};
var NV=[['matches','Matches'],['setup','Setup'],['live','Scoring'],['card','Scorecard'],['pts','Points']],TT={matches:'Match centre',setup:'Match setup',live:'Live scoring',card:'Scorecard',pts:'Fantasy points'};
$('nav').innerHTML=NV.map(function(n){return '<button class="nb" role="tab" data-go="'+n[0]+'"><svg viewBox="0 0 24 24">'+IC[n[0]]+'</svg>'+n[1]+'</button>'}).join('');
function renderAll(){bar();mtch();live();card();pts()}
function go(v){V=v;close();document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-'+v)});
 document.querySelectorAll('.nb').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.go===v))});$('ttl').textContent=TT[v];if(v==='setup')setup();else renderAll();window.scrollTo(0,0)}

/* ---------- wicket sheet ---------- */
function wsheet(){var I=S.inn[S.i],k=WK.k,nf=k==='Caught'||k==='Stumped'||k==='Run out',rem=I.order.filter(function(n){return I.bd.indexOf(n)<0});
 sheet('<h3>Wicket</h3><p>'+I.bw+' to '+I.st+'</p><label>How out</label>'+chips(['Bowled','Caught','LBW','Run out','Stumped'],k,'wk')+
 (k==='Run out'?'<label>Batter out</label>'+chips([I.st,I.ns],WK.out||I.st,'wo'):'')+
 (nf?'<label>'+(k==='Caught'?'Caught by':k==='Stumped'?'Stumped by':'Fielder')+'</label>'+chips(S.X[I.bowl],WK.fl,'wf'):'')+
 (rem.length?'<label>Next batter</label>'+chips(rem,WK.nx,'wn'):'')+
 '<div class="two"><button class="btn" data-a="x">Cancel</button><button class="btn go" data-a="wok">Confirm wicket</button></div>')}

/* ---------- events ---------- */
document.addEventListener('change',function(e){var t=e.target;if(t.id==='sa'||t.id==='sb'){SU[t.id==='sa'?'a':'b']=t.value;SU.xa=squad(SU.a).slice(0,11);SU.xb=squad(SU.b).slice(0,11);SU.toss='';setup()}});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset;
 if(d.go){go(d.go);return}
 if(d.f){MF=d.f;mtch();return}
 if(d.k){var k=d.k,v=d.v;
  if(k==='ov'){SU.ov=+v;setup()}else if(k==='toss'){SU.toss=v;setup()}else if(k==='dec'){SU.dec=v;setup()}else if(k==='sc'){SC=v.indexOf(S.inn[0].bat)===0?0:1;card()}
  else{if(k==='wk'){WK.k=v;if(v==='Bowled'||v==='LBW')WK.fl=''}if(k==='wo')WK.out=v;if(k==='wf')WK.fl=v;if(k==='wn')WK.nx=v;wsheet()}return}
 if(d.x){var arr=d.x==='a'?SU.xa:SU.xb,i=arr.indexOf(d.n);if(i>-1)arr.splice(i,1);else if(arr.length<11)arr.push(d.n);else toast('Already 11 selected. Remove a player first.');setup();return}
 if(d.bw){var I=S.inn[S.i];I.bw=d.bw;close();renderAll();return}
 if(d.ex){PX=PX===d.ex?null:d.ex;live();return}
 if(d.r!=null){ball({r:+d.r,x:PX});return}
 if(d.rs){RL[d.rs]=Math.max(0,RL[d.rs]+(+d.d));pts();return}
 if(d.i!=null&&d.a==='setm'){var m=MS[+d.i];SU={a:m.a,b:m.b,ov:20,toss:'',dec:'',xa:squad(m.a).slice(0,11),xb:squad(m.b).slice(0,11)};go('setup');return}
 var a=d.a;if(!a)return;
 if(a==='x')close();
 if(a==='arch')toast('Archived scorecards open here.');
 if(a==='undo')undo();
 if(a==='swap'){var J=S.inn[S.i],s=J.st;J.st=J.ns;J.ns=s;live();toast('Strike swapped')}
 if(a==='wk'){WK={k:'Bowled',fl:'',out:'',nx:''};wsheet()}
 if(a==='wok'){var K=S.inn[S.i],nf=WK.k==='Caught'||WK.k==='Stumped'||WK.k==='Run out',rm=K.order.filter(function(n){return K.bd.indexOf(n)<0});
  if(nf&&!WK.fl&&WK.k!=='Run out'){toast('Pick the fielder.');return}if(rm.length&&!WK.nx){toast('Pick the next batter.');return}
  close();ball({r:0,x:PX,w:{k:WK.k,fl:WK.fl,out:WK.k==='Run out'?(WK.out||K.st):K.st,nx:WK.nx}})}
 if(a==='inn2'){S.brk=0;openInn(1);post()}
 if(a==='start'){var q=SU;if(q.a===q.b){toast('Pick two different teams.');return}if(!q.toss||!q.dec){toast('Record the toss first.');return}
  if(q.xa.length!==11||q.xb.length!==11){toast('Select exactly 11 players per team.');return}
  var first=q.dec==='Bat'?q.toss:(q.toss===q.a?q.b:q.a);start(q.a,q.b,q.ov,first,q.xa.slice(),q.xb.slice());MS[0]={a:q.a,b:q.b,st:'live',w:'Today',v:'Eden Ground'};SC=0;go('live');bsheet()}
 if(a==='pub')toast('Points published. League tables are updating.');
});

seed();go('matches');
})();
</script>
